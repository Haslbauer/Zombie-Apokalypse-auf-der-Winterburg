# Render-Blueprint (kostenloser Tarif): https://render.com → New → Blueprint → dieses Repo.
# Der Gratis-Dienst schläft nach etwa 15 Minuten ohne Besucher; der erste Aufruf
# danach dauert rund eine Minute (das Spiel zeigt dann „Server wacht auf …“).
services:
  - type: web
    name: zombie-apokalypse
    runtime: node
    plan: free
    region: frankfurt
    # Entwicklungswerkzeuge (Vite, TypeScript) werden zum Bauen gebraucht
    buildCommand: npm ci --include=dev && npx vite build
    startCommand: node --import tsx server/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Spielzähler /stats: optional dauerhaft in Upstash Redis (kostenlos), siehe README „Spielzähler“
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: STATS_KEY
        sync: false
