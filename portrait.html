<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { loadRiggedModel } from '/src/client/models.ts';
import { heroView } from '/src/client/units.ts';
import { gameData } from '/src/gameData.ts';
const id = new URLSearchParams(location.search).get('hero');
const def = gameData.heroes.find((h) => h.id === id);
const W = 240, H = 320;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
// Hintergrund: dunkler Nachtwald-Verlauf wie bei den gemalten Porträts
const c = document.createElement('canvas'); c.width = 4; c.height = 64;
const g = c.getContext('2d'); const grad = g.createLinearGradient(0, 0, 0, 64);
grad.addColorStop(0, '#1d2f22'); grad.addColorStop(1, '#0b130d'); g.fillStyle = grad; g.fillRect(0, 0, 4, 64);
scene.background = new THREE.CanvasTexture(c);
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x2a2a1a, 1.4));
const key = new THREE.DirectionalLight(0xffe2b0, 2.4); key.position.set(2, 3, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc9ff, 1.6); rim.position.set(-3, 2, -2); scene.add(rim);
const models = new Map();
const looks = { imker: 'libero', goldschmied: 'pirat', lotte: 'schlaeferin', taucher: 'rotschopf', gloecknerin: 'schlaeferin', foerster: 'pirat' };
const modelName = looks[id] ?? id;
models.set(modelName, await loadRiggedModel(`/models/${modelName}.glb`, 1.8));
const hero = { id: 1, defId: id, pos: { x: 0, y: 0 }, radius: def.radius, facing: Math.PI / 2, buffs: [], hp: 1, maxHp: 1 };
const view = heroView(hero, def, false, models);
view.bar.visible = false; view.ring.visible = false;
view.group.traverse((o) => { if (o.isLight || o.name === 'glow') o.visible = false; });
const rot = Number(new URLSearchParams(location.search).get('rot') ?? 0.4);
view.group.rotation.y = rot;
scene.add(view.group);
for (let i = 0; i < 40; i++) view.animate(0.05, 0, false);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 50);
const k = Number(new URLSearchParams(location.search).get('k') ?? 1);
cam.position.set(0.2 * k, 1.55 * k, 3.0 * k); cam.lookAt(0, 1.3 * k, 0);
renderer.render(scene, cam);
window.done = true;
</script>
</body></html>
